
#DockerHub
version: 0.2

phases:
  install:
    commands:
      - echo Installing kubectl
      - curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/
      - kubectl version --client

  pre_build:
    commands:
      - echo Logging in to Docker Hub
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

      - echo Updating kubeconfig
      - aws eks --region us-east-1 update-kubeconfig --name brain-cluster

  build:
    commands:
      - echo Building Docker image
      - docker build -t brain-app .
      - docker tag brain-app $DOCKER_USERNAME/brain-app:latest

  post_build:
    commands:
      - echo Pushing to Docker Hub
      - docker push $DOCKER_USERNAME/brain-app:latest

      - echo Verifying cluster access
      - aws sts get-caller-identity
      - kubectl config current-context
      - kubectl get nodes

      - echo Validating manifest
      - kubectl apply -f kubernetes.yaml --dry-run=client

      - echo Deploying application
      - kubectl apply -f kubernetes.yaml

      - echo Deploying service
      - kubectl apply -f service.yaml
